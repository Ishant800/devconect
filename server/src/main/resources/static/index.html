<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Chat Tester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        h2 { text-align: center; }

        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .row {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        input, select, button {
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        select { width: 150px; }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            flex: 1;
        }

        button:hover { background: #45a049; }

        #log {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: #fafafa;
            border-radius: 5px;
            font-size: 14px;
        }

        #log p { margin: 5px 0; }
        .system { color: #ff5722; font-weight: bold; }
        .realtime { color: #2196F3; }
    </style>
</head>
<body>
<div class="container">
    <h2>WebSocket Chat Tester</h2>

    <div class="row">
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>

    <div class="row">
        <input id="type" placeholder="Event Type (PM / BROADCAST / NOTIFY / REALTIME)">
        <input id="to" placeholder="To (for PM)">
    </div>

    <div class="row">
        <input id="msg" placeholder="Message">
        <button onclick="send()">Send</button>
    </div>

    <h3>Logs</h3>
    <div id="log"></div>
</div>

<script>
    let socket;

    function connect() {
        if(socket && socket.readyState === WebSocket.OPEN) return log("✅ Already connected");

        socket = new WebSocket("ws://localhost:8081/ws"); // Update port if needed

        socket.onopen = () => log("✅ Connected to server");
        socket.onclose = () => log("❌ Disconnected from server");
        socket.onerror = (err) => log("⚠️ Error: " + err);

        socket.onmessage = e => {
            try {
                const data = JSON.parse(e.data);

                // Determine CSS class
                let cls = "";
                if(data.event === "NOTIFY") cls = "system";
                if(data.event === "REALTIME") cls = "realtime";

                // Show message in logs
                log(`[${data.event}] ${data.from} → ${data.to || "ALL"}: ${data.message}`, cls);
            } catch(err) {
                log("⚠️ Received malformed message: " + e.data);
            }
        };
    }

    function send() {
        if(!socket || socket.readyState !== WebSocket.OPEN) {
            return log("⚠️ Not connected!");
        }

        const eventType = document.getElementById("type").value.trim().toUpperCase();
        const toUser = document.getElementById("to").value.trim();
        const message = document.getElementById("msg").value.trim();

        if(!eventType || !message) {
            return log("⚠️ Event type and message required!");
        }

        const payload = {
            event: eventType,
            to: toUser,
            message: message
        };

        socket.send(JSON.stringify(payload));
        log(`📤 Sent: [${payload.event}] ${payload.message}`, "system");
    }

    function disconnect() {
        if(socket) socket.close();
    }

    function log(msg, cls="") {
        const div = document.getElementById("log");
        const p = document.createElement("p");
        p.textContent = msg;
        if(cls) p.classList.add(cls);
        div.appendChild(p);
        div.scrollTop = div.scrollHeight;
    }
</script>
</body>
</html>
