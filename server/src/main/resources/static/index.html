<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Audio Connect</title>
    <style>
        :root {
            --primary: #4a90e2;
            --danger: #e74c3c;
            --success: #2ecc71;
            --bg: #f5f7fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 { color: #333; text-align: center; margin-top: 0; }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.7; }

        .btn-connect { background: var(--primary); color: white; }
        .btn-call { background: var(--success); color: white; padding: 5px 15px; }
        .btn-accept { background: var(--success); color: white; flex: 1; }
        .btn-reject { background: var(--danger); color: white; flex: 1; }

        #status {
            text-align: center;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 20px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
        }

        #user-list {
            list-style: none;
            padding: 0;
        }

        #user-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        #incomingCall {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 350px;
            background: white;
            border: 2px solid var(--primary);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .call-actions { display: flex; gap: 10px; margin-top: 15px; }

        /* Hide audio elements */
        audio { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Audio Call</h2>

    <div id="status">Status: Disconnected</div>

    <div class="input-group">
        <input type="text" id="username" placeholder="Your Name...">
        <button class="btn-connect" onclick="connect()">Go Online</button>
    </div>

    <h3>Available Users</h3>
    <ul id="user-list"></ul>
</div>

<div id="incomingCall">
    <div style="text-align:center">
        <strong>Incoming Audio Call</strong>
        <p id="callerName">User is calling...</p>
    </div>
    <div class="call-actions">
        <button class="btn-accept" onclick="acceptCall()">Accept</button>
        <button class="btn-reject" onclick="rejectCall()">Decline</button>
    </div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script>
    let ws;
    let localStream;
    let peerConnection;
    let myUsername;
    let targetUser;
    let incomingOfferData = null;

    const rtcConfig = {
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    };

    // 1. Initial Signaling Setup
    function connect() {
        myUsername = document.getElementById("username").value;
        if (!myUsername) return alert("Please enter a username");

        // Dynamic protocol for Mobile/Production (ws vs wss)
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        ws = new WebSocket(`${protocol}${window.location.host}/signal`);

        ws.onopen = () => {
            ws.send(JSON.stringify({ type: "login", username: myUsername }));
            updateStatus("Online as " + myUsername);
        };

        ws.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);
            switch(data.type) {
                case "user-list":
                    renderUserList(data.users);
                    break;
                case "offer":
                    handleIncomingOffer(data);
                    break;
                case "answer":
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    updateStatus("Call Connected");
                    break;
                case "candidate":
                    if (peerConnection) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                    break;
            }
        };
    }

    // 2. Media Acquisition (Crucial for Mobile)
    async function setupLocalAudio() {
        try {
            // Re-use stream if already active
            if (localStream) return true;

            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            updateStatus("Microphone ready");
            return true;
        } catch (err) {
            console.error(err);
            updateStatus("Mic Error: Use HTTPS or check permissions");
            return false;
        }
    }

    // 3. Initiate Call
    async function callUser(user) {
        targetUser = user;
        updateStatus("Ringing " + user + "...");

        const success = await setupLocalAudio();
        if (!success) return;

        initPeerConnection();

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        ws.send(JSON.stringify({
            type: "offer",
            target: targetUser,
            offer: offer
        }));
    }

    // 4. Handle Incoming Call
    function handleIncomingOffer(data) {
        incomingOfferData = data.offer;
        targetUser = data.username;
        document.getElementById("callerName").innerText = targetUser + " wants to talk";
        document.getElementById("incomingCall").style.display = "block";
    }

    async function acceptCall() {
        document.getElementById("incomingCall").style.display = "none";

        const success = await setupLocalAudio();
        if (!success) return;

        initPeerConnection();

        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOfferData));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        ws.send(JSON.stringify({
            type: "answer",
            target: targetUser,
            answer: answer
        }));

        updateStatus("Call Connected");
    }

    // 5. Peer Connection Logic
    function initPeerConnection() {
        peerConnection = new RTCPeerConnection(rtcConfig);

        // Add local audio tracks to the connection
        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

        // Send ICE candidates to the other peer
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                ws.send(JSON.stringify({
                    type: "candidate",
                    target: targetUser,
                    candidate: event.candidate
                }));
            }
        };

        // Play the remote audio
        peerConnection.ontrack = (event) => {
            const remoteAudio = document.getElementById("remoteAudio");
            if (remoteAudio.srcObject !== event.streams[0]) {
                remoteAudio.srcObject = event.streams[0];
            }
        };

        peerConnection.onconnectionstatechange = () => {
            updateStatus("Connection: " + peerConnection.connectionState);
        };
    }

    // UI Helpers
    function renderUserList(users) {
        const list = document.getElementById("user-list");
        list.innerHTML = "";
        users.forEach(u => {
            if (u === myUsername) return;
            const li = document.createElement("li");
            li.innerHTML = `<span>${u}</span> <button class="btn-call" onclick="callUser('${u}')">Call</button>`;
            list.appendChild(li);
        });
    }

    function updateStatus(msg) {
        document.getElementById("status").innerText = "Status: " + msg;
    }

    function rejectCall() {
        document.getElementById("incomingCall").style.display = "none";
        updateStatus("Call Rejected");
    }
</script>
</body>
</html>
