<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Realtime Chat • Cloudinary + WebSocket</title>

    <style>

        body{
            margin:0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto;
            background: linear-gradient(135deg,#0f172a,#020617);
            color:white;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .chat-container{
            width:500px;
            height:700px;
            background:#020617;
            border-radius:15px;
            display:flex;
            flex-direction:column;
            box-shadow:0 0 40px rgba(0,0,0,0.6);
        }

        .header{
            padding:15px;
            font-weight:bold;
            border-bottom:1px solid #1e293b;
            text-align:center;
            background:#020617;
        }

        .messages{
            flex:1;
            padding:15px;
            overflow-y:auto;
        }

        .message{
            margin-bottom:12px;
            padding:10px;
            border-radius:10px;
            background:#1e293b;
            animation:fadeIn 0.2s ease;
        }

        .self{
            background:#2563eb;
        }

        .file{
            background:#059669;
        }

        .input-area{
            display:flex;
            padding:10px;
            border-top:1px solid #1e293b;
        }

        input[type="text"]{
            flex:1;
            padding:10px;
            border:none;
            outline:none;
            border-radius:8px;
            background:#1e293b;
            color:white;
        }

        button{
            margin-left:10px;
            padding:10px 15px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .file-input{
            display:none;
        }

        img{
            max-width:200px;
            border-radius:8px;
            margin-top:5px;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(5px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        Realtime Chat 🚀
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">

        <input id="textInput" placeholder="Type message...">

        <button onclick="sendMessage()">Send</button>

        <button onclick="selectFile()">File</button>

        <input type="file" id="fileInput" class="file-input">

    </div>

</div>


<script>

    const ws = new WebSocket("ws://localhost:8081/ws");

    const messagesDiv = document.getElementById("messages");

    const textInput = document.getElementById("textInput");

    const fileInput = document.getElementById("fileInput");

    let username = "";


    ws.onmessage = (event)=>{

        try{

            const msg = JSON.parse(event.data);

            displayMessage(msg);

        }
        catch{

            username = event.data;

            displaySystem(event.data);

        }
    };


    function sendMessage(){

        const text = textInput.value;

        if(!text) return;

        const msg = {

            event:"BROADCAST",
            message:text

        };

        ws.send(JSON.stringify(msg));

        textInput.value="";
    }


    function displayMessage(msg){

        const div = document.createElement("div");

        div.classList.add("message");

        if(msg.event === "FILE"){

            div.classList.add("file");

            if(msg.fileUrl.match(/\.(jpeg|jpg|png|gif)$/)){

                div.innerHTML =
                `<b>${msg.from}</b><br>
                <img src="${msg.fileUrl}">
                <br><a href="${msg.fileUrl}" target="_blank">Download</a>`;

            }
            else{

                div.innerHTML =
                `<b>${msg.from}</b><br>
                <a href="${msg.fileUrl}" target="_blank">
                Download File
                </a>`;
            }

        }
        else{

            div.innerHTML =
            `<b>${msg.from}</b><br>${msg.message}`;
        }

        messagesDiv.appendChild(div);

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }


    function displaySystem(text){

        const div = document.createElement("div");

        div.classList.add("message");

        div.innerHTML = `<i>${text}</i>`;

        messagesDiv.appendChild(div);
    }


    function selectFile(){

        fileInput.click();
    }


    fileInput.onchange = async ()=>{

        const file = fileInput.files[0];

        if(!file) return;

        const formData = new FormData();

        formData.append("file",file);

        await fetch("http://localhost:8081/fileUpload/upload",{

            method:"POST",

            body:formData

        });

    };


</script>

</body>

</html>
